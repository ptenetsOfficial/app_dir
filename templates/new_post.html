<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить пост</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Добавить новый пост</h1>
    <form action="/add_post" method="POST">
        <label for="title">Заголовок:</label><br>
        <input type="text" id="title" name="title" required><br>

        <label for="category">Категория:</label><br>
        <div class="category-picker">
            <input type="hidden" id="category" name="category" value="">
            <button type="button" class="category-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span>Выберите категорию</span>
                <span class="category-arrow" aria-hidden="true"></span>
            </button>
            <div class="category-menu" role="listbox" tabindex="-1">
                <button type="button" class="category-option is-placeholder" data-value="">Выберите категорию</button>
                {% for category in categories %}
                <button type="button" class="category-option" data-value="{{ category[0] }}">{{ category[1] }}</button>
                {% endfor %}
            </div>
        </div>

        <label for="content">Содержимое:</label><br>
        <textarea id="content" name="content" required></textarea><br>

        <input type="submit" value="Добавить пост">
    </form>
    <a href="/">На главную</a>
    <script>
        const picker = document.querySelector('.category-picker');
        const nativeCategory = document.querySelector('#category');
        const trigger = picker.querySelector('.category-trigger');
        const menu = picker.querySelector('.category-menu');
        const triggerText = trigger.querySelector('span');

        trigger.addEventListener('click', () => {
            const isOpen = picker.classList.toggle('is-open');
            trigger.setAttribute('aria-expanded', isOpen);
        });

        menu.querySelectorAll('.category-option').forEach((option) => {
            option.addEventListener('click', () => {
                nativeCategory.value = option.dataset.value;
                triggerText.textContent = option.textContent;
                picker.classList.remove('is-open');
                trigger.setAttribute('aria-expanded', 'false');
                nativeCategory.dispatchEvent(new Event('change'));
            });
        });

        document.addEventListener('click', (event) => {
            if (!picker.contains(event.target)) {
                picker.classList.remove('is-open');
                trigger.setAttribute('aria-expanded', 'false');
            }
        });

        document.querySelector('form').addEventListener('submit', (event) => {
            if (!nativeCategory.value) {
                event.preventDefault();
                trigger.focus();
                picker.classList.add('is-open');
            }
        });
    </script>
</body>
</html>
